<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Management - Tổng quan</title>
    <link rel="stylesheet" href="css/trangchulichhen.css">
</head>

<body>
    <!-- ================= MAIN ================= -->
    <main class="main">
        <header class="header">
            <div class="header-title">
                <span>Trang chủ</span>
        </header>

        <section class="content">
            <div class="page-title">
                <div>
                    <h1>Tổng quan</h1>
                    <p>Thông tin tổng quan của hệ thống</p>
                </div>
                <button class="primary-button" onclick="window.location.href='lichhen.html'">
                    + Tạo lịch hẹn
                </button>
            </div>

            <div class="cards">
                <div class="card">
                    <div class="card-icon blue">+</div>
                    <div>
                        <p>Bệnh nhân</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon green">+</div>
                    <div>
                        <p>Bác sĩ</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon orange">+</div>
                    <div>
                        <p>Lịch khám</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon purple">+</div>
                    <div>
                        <p>Phòng khám</p>
                        <h2>0</h2>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h3>Lịch hẹn hôm nay</h3>
                        </div>
                    </div>
                    <div class="placeholder box-padding">
                        <h3>Chưa có lịch hẹn hôm nay</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="site-footer">
        <div class="Email">2026 © <strong>LMD-H</strong> | Email: LMD-H@gmail.com</div>
        <div class="footer-link"><a href="#">Về chúng tôi</a><a href="#">Liên Hệ</a></div>
    </footer>
    
    <script src="javascipt/trangchulichhen.js"></script>
</body>
</html>
