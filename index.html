<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Management - Tổng quan</title>
    <link rel="stylesheet" href="global.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">H</div>
            <span>HEALTH</span>
        </div>

        <nav class="menu">
            <a href="index.html" class="menu-item active">
                <span class="menu-icon">⌂</span>
                <span>Tổng quan</span>
            </a>
            <a href="calendar.html" class="menu-item">
                <span class="menu-icon">●</span>
                <span>Lịch khám</span>
            </a>
            <a href="#" class="menu-item">
                <span class="menu-icon">●</span>
                <span>Bệnh nhân</span>
            </a>
            <a href="#" class="menu-item">
                <span class="menu-icon">●</span>
                <span>Bác sĩ</span>
            </a>
            <a href="#" class="menu-item">
                <span class="menu-icon">⚙</span>
                <span>Cài đặt</span>
            </a>
        </nav>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">
        <header class="header">
            <div class="header-title">
                <h2>Dashboard</h2>
                <p>Hệ thống quản lý y tế</p>
            </div>
            <div class="header-right">
                <div class="user-icon">U</div>
            </div>
        </header>

        <section class="content">
            <div class="page-title">
                <div>
                    <h1>Tổng quan</h1>
                    <p>Thông tin tổng quan của hệ thống</p>
                </div>
                <button class="primary-button" onclick="window.location.href='calendar.html'">
                    + Tạo lịch hẹn
                </button>
            </div>

            <!-- CARDS -->
            <div class="cards">
                <div class="card">
                    <div class="card-icon blue">+</div>
                    <div>
                        <p>Bệnh nhân</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon green">+</div>
                    <div>
                        <p>Bác sĩ</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon orange">+</div>
                    <div>
                        <p>Lịch khám</p>
                        <h2>0</h2>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon purple">+</div>
                    <div>
                        <p>Phòng khám</p>
                        <h2>0</h2>
                    </div>
                </div>
            </div>

            <!-- BOTTOM AREA -->
            <div class="dashboard-grid">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h3>Lịch hẹn hôm nay</h3>
                            <p>Khu vực quản lý lịch hẹn nhanh</p>
                        </div>
                    </div>
                    <div class="placeholder box-padding">
                        <h3>Chưa có lịch hẹn hôm nay</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
