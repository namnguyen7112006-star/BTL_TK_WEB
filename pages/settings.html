<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt tài khoản - LMD+H</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/custom.css">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <a href="../index.html">
                <img src="../assets/logo.png" alt="LMD+H">
            </a>
        </div>

        <nav class="menu">
            <a href="../index.html" class="menu-item"><span class="menu-icon">⌂</span><span>Tổng quan</span></a>
            <a href="patients.html" class="menu-item"><span class="menu-icon">●</span><span>Bệnh nhân</span></a>
            <a href="doctors.html" class="menu-item"><span class="menu-icon">●</span><span>Bác sĩ</span></a>
            <a href="appointments.html" class="menu-item"><span class="menu-icon">●</span><span>Lịch khám</span></a>
            <a href="paraclinical.html" class="menu-item"><span class="menu-icon">✚</span><span>Kỹ thuật Đông y</span></a>
            <a href="report.html" class="menu-item"><span class="menu-icon">📊</span><span>Báo cáo & Hóa đơn</span></a>
            <a href="settings.html" class="menu-item active"><span class="menu-icon">⚙</span><span>Cài đặt</span></a>
        </nav>
    </aside>

    <main class="main">
        <header class="header">
            <div class="header-title">
                <h2>Cài đặt</h2>
                <p>Trang chủ / Cài đặt tài khoản</p>
            </div>
            <div class="header-right">
                <button class="notification-button">🔔<span class="notification-dot"></span></button>
                <div class="user-icon">BS</div>
            </div>
        </header>

        <section class="content">
            <div class="settings-layout">
                <!-- Cột trái: Menu cài đặt -->
                <aside class="settings-subnav">
                    <div class="subnav-link active">● Thông tin cơ bản</div>
                    <div class="subnav-heading">Cấu hình phòng khám</div>
                    <div class="subnav-link" onclick="alert('Đang cập nhật tab này!')">Thông tin phòng khám</div>
                    <div class="subnav-link" onclick="alert('Đang cập nhật tab này!')">Thanh toán</div>
                    <div class="subnav-link" onclick="alert('Đang cập nhật tab này!')">Tính năng & In ấn</div>
                    <div class="subnav-heading">Tích hợp</div>
                    <div class="subnav-link" onclick="alert('Đang cập nhật tab này!')">Hóa đơn điện tử</div>
                </aside>

                <!-- Cột phải: Form thông tin -->
                <div class="settings-form-card">
                    <h3 style="margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0;">Thông tin tài khoản</h3>
                    <form id="profileForm" onsubmit="saveProfile(event)">
                        <div class="form-group-item">
                            <label>Ảnh đại diện</label>
                            <div class="avatar-upload-box" onclick="document.getElementById('avatarFile').click()">
                                <img id="previewImg" src="../assets/logo.png" alt="Avatar">
                            </div>
                            <input type="file" id="avatarFile" accept="image/*" style="display:none;" onchange="handleAvatarChange(event)">
                        </div>

                        <div class="form-group-item">
                            <label>Họ và tên *</label>
                            <div class="name-flex-grid">
                                <select id="titlePrefix">
                                    <option value="BS.">BS.</option>
                                    <option value="Lương y">Lương y</option>
                                    <option value="ThS.BS">ThS.BS</option>
                                </select>
                                <input type="text" id="lastName" placeholder="Họ và tên đệm" value="Hoàng Văn" required>
                                <input type="text" id="firstName" placeholder="Tên" value="Minh" required>
                            </div>
                        </div>

                        <div class="form-group-item">
                            <label>Mã Giấy phép / CCHN</label>
                            <input type="text" id="licenseNum" value="CCHN-YHCT-08824" placeholder="Nhập mã chứng chỉ hành nghề YHCT">
                        </div>

                        <div class="form-group-item">
                            <label>Mã Phòng Khám</label>
                            <input type="text" value="LMDH-25602384" readonly>
                        </div>

                        <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
                            <button type="submit" class="primary-button">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="../javascipt/settings.js"></script>
</body>

</html>
